services:
  db:
    image: postgres:16-alpine
    container_name: radio_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: radio_db
      POSTGRES_USER: radio_user
      POSTGRES_PASSWORD: radio_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radio_user -d radio_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: radio_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=secret-key-production-radioplatform-ihe
      - DATABASE_URL=postgres://radio_user:radio_password@db:5432/radio_db
      - ORTHANC_URL=http://orthanc:8042
      - ORTHANC_USER=orthanc
      - ORTHANC_PASS=orthanc
    depends_on:
      db:
        condition: service_healthy

  orthanc:
    image: orthancteam/orthanc:25.4.1
    container_name: radio_orthanc
    restart: unless-stopped
    ports:
      - "4242:4242"
      - "8042:8042"
    volumes:
      - orthanc_data:/var/lib/orthanc/db
      - ./orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./orthanc/on_stable_study.lua:/etc/orthanc/on_stable_study.lua:ro
    environment:
      - ORTHANC_NAME=RadioPlatformPACS
      - VERBOSE_ENABLED=true
    depends_on:
      db:
        condition: service_healthy

  ohif:
    image: ohif/app:v3.9.2
    container_name: radio_ohif
    restart: unless-stopped
    ports:
      - "3001:80"
    volumes:
      - ./ohif/app-config.js:/usr/share/nginx/html/app-config.js:ro
      - ./ohif/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - orthanc

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: radio_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
      - orthanc
      - ohif

volumes:
  postgres_data:
  orthanc_data:
